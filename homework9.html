<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЗ по ОГЭ: Задание 9 (Уравнения)</title>
<style>
  :root{
    --primary:#4F46E5;
    --primary-hover:#4338CA;
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --text:#1E293B;
    --muted:#64748B;
    --border:#E2E8F0;
    --success:#10B981;
    --error:#EF4444;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --shadow-hover:0 10px 20px -5px rgba(79,70,229,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:920px;margin:0 auto}
  .header{text-align:center;margin-bottom:36px}
  .header h1{font-size:30px;font-weight:800;color:var(--primary);letter-spacing:-.5px;margin-bottom:8px}
  .header p{color:var(--muted);font-size:15px}
  
  .task-card{
    background:var(--card);border-radius:16px;padding:28px;margin-bottom:20px;
    box-shadow:var(--shadow);border:1px solid var(--border);
    transition:box-shadow .2s ease,transform .2s ease;
  }
  .task-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  
  .task-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--bg)}
  .task-number{background:var(--primary);color:#fff;font-weight:700;padding:4px 12px;border-radius:20px;font-size:13px;letter-spacing:.3px}
  .task-type{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  
  .task-content{font-size:17px;margin-bottom:22px}
  .math{font-family:"Cambria Math","Times New Roman",serif;font-size:1.15em;white-space:nowrap;font-weight:500;}
  .math sup{font-size:.7em;vertical-align:super}
  
  .instruction{
    font-size:15px; color:var(--muted); margin-top:8px; 
    background:#F1F5F9; padding:10px 14px; border-radius:8px; border-left:3px solid var(--primary);
  }

  .answer-section{
    display:flex;align-items:center;gap:14px;background:#F8FAFC;
    padding:14px 16px;border-radius:10px;border:1px dashed var(--border);
    flex-wrap:wrap; margin-top: 15px;
  }
  .answer-label{font-weight:700;font-size:15px}
  .answer-input{
    width:100px;padding:9px 10px;border:1.5px solid var(--border);
    border-radius:8px;font-size:16px;font-family:inherit;text-align:center;
    font-weight:600; transition: border-color 0.2s;
  }
  .answer-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  
  .check-btn{
    background:var(--primary);color:#fff;border:none;padding:9px 22px;
    border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;
    transition:background .15s;font-family:inherit;
  }
  .check-btn:hover{background:var(--primary-hover)}
  
  .result{font-weight:600;font-size:14px;display:none}
  .result.correct{color:var(--success);display:block}
  .result.incorrect{color:var(--error);display:block}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Практикум: Задание 9</h1>
    <p>Уравнения · отработка всех прототипов ОГЭ (линейные, квадратные, неполные)</p>
  </div>
  <div id="tasks"></div>
</div>

<script>
/* ===== База заданий ===== */
const T = [];

// 1-3: Линейные уравнения с дробными/отрицательными коэффициентами
T.push({
  type: "Линейное уравнение", 
  text: 'Найдите корень уравнения <span class="math">−8x − 3 = −6x</span>',
  ans: '-1.5', 
  hint: 'Перенесите слагаемые с x влево, числа вправо.'
});
T.push({
  type: "Линейное уравнение", 
  text: 'Найдите корень уравнения <span class="math">−4x − 9 = 6x</span>',
  ans: '-0.9', 
  hint: 'При переносе через знак равенства знак слагаемого меняется.'
});
T.push({
  type: "Линейное уравнение", 
  text: 'Найдите корень уравнения <span class="math">−5 + 9x = 10x + 4</span>',
  ans: '-9', 
  hint: 'Соберите x с одной стороны, числа с другой.'
});

// 4-5: Линейные уравнения со скобками
T.push({
  type: "Уравнение со скобками", 
  text: 'Найдите корень уравнения <span class="math">4(x − 8) = −5</span>',
  ans: '6.75', 
  hint: 'Раскройте скобки или разделите обе части на 4.'
});
T.push({
  type: "Уравнение со скобками", 
  text: 'Найдите корень уравнения <span class="math">4(x − 6) = 5</span>',
  ans: '7.25', 
  hint: 'Сначала разделите обе части на 4, затем перенесите число.'
});

// 6-7: Неполные квадратные уравнения (разность квадратов)
T.push({
  type: "Неполное квадратное уравнение", 
  text: 'Решите уравнение <span class="math">x² − 4 = 0</span>',
  instruction: 'Если уравнение имеет более одного корня, в ответ запишите меньший из корней.',
  ans: '-2', 
  hint: 'Разложите по формуле разности квадратов: (x − 2)(x + 2) = 0.'
});
T.push({
  type: "Неполное квадратное уравнение", 
  text: 'Решите уравнение <span class="math">x² − 16 = 0</span>',
  instruction: 'Если уравнение имеет более одного корня, в ответ запишите меньший из корней.',
  ans: '-4', 
  hint: 'Корни равны ±4. Не забудьте выбрать меньший (отрицательный).'
});

// 8: Неполное квадратное уравнение (вынесение x)
T.push({
  type: "Неполное квадратное уравнение", 
  text: 'Решите уравнение <span class="math">3x² = 9x</span>',
  instruction: 'Если уравнение имеет более одного корня, в ответ запишите меньший из корней.',
  ans: '0', 
  hint: 'Нельзя делить на x! Перенесите всё влево и вынесите x за скобку.'
});

// 9-10: Полные квадратные уравнения (по теореме Виета или дискриминанту)
T.push({
  type: "Квадратное уравнение", 
  text: 'Решите уравнение <span class="math">x² − 9x + 18 = 0</span>',
  instruction: 'Если уравнение имеет более одного корня, в ответ запишите меньший из корней.',
  ans: '3', 
  hint: 'Сумма корней равна 9, произведение равно 18.'
});
T.push({
  type: "Квадратное уравнение", 
  text: 'Решите уравнение <span class="math">x² − 10x + 24 = 0</span>',
  instruction: 'Если уравнение имеет более одного корня, в ответ запишите меньший из корней.',
  ans: '4', 
  hint: 'Можно использовать теорему Виета: x₁ + x₂ = 10, x₁ · x₂ = 24.'
});

/* ===== Рендер ===== */
const root = document.getElementById('tasks');

T.forEach((t, i) => {
  const card = document.createElement('div');
  card.className = 'task-card';

  let head = `
    <div class="task-header">
      <span class="task-number">Задание ${i + 1}</span>
      <span class="task-type">${t.type}</span>
    </div>`;

  let body = `<div class="task-content">
      ${t.text}
      ${t.instruction ? `<div class="instruction">${t.instruction}</div>` : ''}
    </div>`;

  const foot = `
    <div class="answer-section">
      <span class="answer-label">Ответ:</span>
      <input type="text" class="answer-input" id="ans${i}" placeholder="Число">
      <button class="check-btn" onclick="check(${i}, '${t.ans}')">Проверить</button>
      <span class="result" id="res${i}"></span>
    </div>`;

  card.innerHTML = head + body + foot;
  root.appendChild(card);
});

/* ===== Проверка ответов ===== */
function check(i, correct) {
  const input = document.getElementById('ans' + i);
  const result = document.getElementById('res' + i);
  let val = input.value.trim().replace(',', '.'); // Меняем запятую на точку для удобства

  if (!val) {
    result.className = 'result incorrect';
    result.textContent = 'Введите ответ!';
    return;
  }

  // Приводим к числу для точного сравнения (например, -1.5 и -1,50)
  if (parseFloat(val) === parseFloat(correct)) {
    result.className = 'result correct';
    result.textContent = '✓ Верно! Молодец.';
    input.style.borderColor = 'var(--success)';
  } else {
    result.className = 'result incorrect';
    result.textContent = '✗ Неверно. Проверьте вычисления.';
    input.style.borderColor = 'var(--error)';
  }
}
</script>
</body>
</html>
