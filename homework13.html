<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЗ по ОГЭ: Задание 13 (Неравенства)</title>
<style>
  :root{
    --primary:#4F46E5;
    --primary-hover:#4338CA;
    --bg:#F8FAFC;
    --card:#FFFFFF;
    --text:#1E293B;
    --muted:#64748B;
    --border:#E2E8F0;
    --success:#10B981;
    --error:#EF4444;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --shadow-hover:0 10px 20px -5px rgba(79,70,229,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:920px;margin:0 auto}
  .header{text-align:center;margin-bottom:36px}
  .header h1{font-size:30px;font-weight:800;color:var(--primary);letter-spacing:-.5px;margin-bottom:8px}
  .header p{color:var(--muted);font-size:15px}
  .task-card{
    background:var(--card);border-radius:16px;padding:28px;margin-bottom:20px;
    box-shadow:var(--shadow);border:1px solid var(--border);
    transition:box-shadow .2s ease,transform .2s ease;
  }
  .task-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  .task-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--bg)}
  .task-number{background:var(--primary);color:#fff;font-weight:700;padding:4px 12px;border-radius:20px;font-size:13px;letter-spacing:.3px}
  .task-type{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .task-content{font-size:17px;margin-bottom:22px}
  .math{font-family:"Cambria Math","Times New Roman",serif;font-size:1.12em;white-space:nowrap}
  .math sup{font-size:.7em;vertical-align:super}
  .math sub{font-size:.7em;vertical-align:sub}
  .system-container{display:inline-flex;align-items:center;margin:14px 0 14px 20px}
  .system-bracket{font-family:"Times New Roman",serif;font-size:64px;font-weight:300;line-height:.85;margin-right:10px;color:#475569;transform:translateY(-4px)}
  .system-equations{display:flex;flex-direction:column;gap:6px}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:700px){.options-grid{grid-template-columns:1fr}}
  .option{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;background:#F8FAFC;font-size:15px}
  .option:hover{border-color:var(--primary);background:#EEF2FF}
  .option input[type=radio]{accent-color:var(--primary);width:17px;height:17px;cursor:pointer;flex-shrink:0}
  .option-graph{flex-direction:column;align-items:stretch;padding:12px}
  .option-graph .opt-line{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .option-graph svg{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
  .answer-section{display:flex;align-items:center;gap:14px;background:#F8FAFC;padding:14px 16px;border-radius:10px;border:1px dashed var(--border);flex-wrap:wrap}
  .answer-label{font-weight:700;font-size:15px}
  .answer-input{width:70px;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;text-align:center;font-weight:600}
  .answer-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .check-btn{background:var(--primary);color:#fff;border:none;padding:9px 22px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s;font-family:inherit}
  .check-btn:hover{background:var(--primary-hover)}
  .result{font-weight:600;font-size:14px;display:none}
  .result.correct{color:var(--success);display:block}
  .result.incorrect{color:var(--error);display:block}
  svg{display:block}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Практикум: Задание 13</h1>
    <p>Неравенства и системы неравенств · отработка всех прототипов ОГЭ</p>
  </div>
  <div id="tasks"></div>
</div>

<script>
/* ===== Утилиты для SVG-графиков (без внешних библиотек) ===== */
function svgAxis(w,h){
  const y=h/2;
  return `<line x1="12" y1="${y}" x2="${w-10}" y2="${y}" stroke="#334155" stroke-width="1.8"/>
          <polygon points="${w-10},${y-4} ${w},${y} ${w-10},${y+4}" fill="#334155"/>`;
}
function pt(x,y,filled){
  return filled
    ? `<circle cx="${x}" cy="${y}" r="4.5" fill="#1E293B"/>`
    : `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="#1E293B" stroke-width="2"/>`;
}
function shade(x1,x2,y){
  return `<line x1="${x1}" y1="${y-6}" x2="${x2}" y2="${y-6}" stroke="#1E293B" stroke-width="3.2" stroke-linecap="round"/>`;
}
function label(x,y,t){
  return `<text x="${x}" y="${y+18}" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">${t}</text>`;
}
function arrowRight(w,y){return `<polygon points="${w-10},${y-4} ${w},${y} ${w-10},${y+4}" fill="#334155"/>`;}
function arrowLeft(y){return `<polygon points="10,${y-4} 0,${y} 10,${y+4}" fill="#334155"/>`;}

/* Отрисовка стандартного графика по конфигу */
function drawGraph(cfg){
  const W=240,H=48,y=H/2,pad=26;
  const scale = v => pad + ((v+10)/20)*(W-2*pad);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<line x1="14" y1="${y}" x2="${W-10}" y2="${y}" stroke="#334155" stroke-width="1.8"/>`;
  s+=arrowRight(W,y);

  if(cfg.type==="seg"){
    const x1=scale(cfg.a), x2=scale(cfg.b);
    s+=shade(x1,x2,y);
    s+=pt(x1,y,cfg.filled); s+=pt(x2,y,cfg.filled);
    s+=label(x1,y,cfg.l1); s+=label(x2,y,cfg.l2);
  } else if(cfg.type==="rayR"){
    const x=scale(cfg.a);
    s+=shade(x,W-14,y); s+=pt(x,y,cfg.filled);
    s+=label(x,y,cfg.l1);
  } else if(cfg.type==="rayL"){
    const x=scale(cfg.a);
    s+=shade(14,x,y); s+=pt(x,y,cfg.filled);
    s+=label(x,y,cfg.l1);
  } else if(cfg.type==="raysOut"){
    const x1=scale(cfg.a), x2=scale(cfg.b);
    s+=shade(14,x1,y); s+=shade(x2,W-14,y);
    s+=pt(x1,y,cfg.filled); s+=pt(x2,y,cfg.filled);
    s+=label(x1,y,cfg.l1); s+=label(x2,y,cfg.l2);
  } else if(cfg.type==="raysIn"){
    const x1=scale(cfg.a), x2=scale(cfg.b);
    s+=shade(x1,x2,y);
    s+=pt(x1,y,cfg.filled); s+=pt(x2,y,cfg.filled);
    s+=label(x1,y,cfg.l1); s+=label(x2,y,cfg.l2);
  }
  s+=`</svg>`;
  return s;
}

/* ===== База заданий ===== */
const T = [];

/* --- 1–6: Линейные неравенства --- */
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">4 − 3x ≥ 2x − 11</span>',
  opts:['(−∞; 3]','[3; +∞)','(−∞; 1,4]','[1,4; +∞)'],ans:'2'});
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">7x − 3 &lt; 2x + 12</span>',
  opts:['(−∞; 3)','(3; +∞)','(−∞; 1,8)','(1,8; +∞)'],ans:'1'});
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">5 − 2x ≤ 3x + 20</span>',
  opts:['(−∞; −3]','[−3; +∞)','(−∞; 5]','[5; +∞)'],ans:'2'});
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">9x + 2 &lt; 5x − 6</span>',
  opts:['(−∞; −2)','(−2; +∞)','(−∞; −1)','(−1; +∞)'],ans:'1'});
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">3 − 4x > 11 − 2x</span>',
  opts:['(−∞; −4)','(−4; +∞)','(−∞; 4)','(4; +∞)'],ans:'1'});
T.push({type:"Линейное неравенство",text:'Укажите решение неравенства <span class="math">2x + 7 ≥ 5x − 11</span>',
  opts:['(−∞; 6]','[6; +∞)','(−∞; −6]','[−6; +∞)'],ans:'1'});

/* --- 7–12: Системы неравенств --- */
T.push({type:"Система неравенств",system:['−12 + 3x &lt; 0','2 − 7x &lt; −33'],
  opts:['(−∞; 4)','нет решений','(4; 5)','(5; +∞)'],ans:'4'});
T.push({type:"Система неравенств",system:['x − 6,6 ≥ 0','x + 1 ≥ 5'],
  opts:['[4; +∞)','[4; 6,6]','[6,6; +∞)','(−∞; 4]'],ans:'3'});
T.push({type:"Система неравенств",system:['−35 + 5x &lt; 0','6 − 3x &lt; −3'],
  opts:['(−∞; 3)','нет решений','(−∞; 7)','(3; 7)'],ans:'4'});
T.push({type:"Система неравенств",system:['4x − 10 &lt; 0','3x + 2 > 5'],
  opts:['(−∞; 1)','(1; 2,5)','(2,5; +∞)','нет решений'],ans:'2'});
T.push({type:"Система неравенств",system:['2x − 8 ≥ 0','3 − x ≥ 1'],
  opts:['(−∞; 2]','[2; 4]','[4; +∞)','нет решений'],ans:'2'});
T.push({type:"Система неравенств",system:['5x + 1 &gt; 0','2 − 4x ≥ 0'],
  opts:['(−∞; −0,2)','(−0,2; 0,5]','[0,5; +∞)','нет решений'],ans:'2'});

/* --- 13–18: Квадратные неравенства (графики) --- */
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">5x − x² ≥ 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:0,b:5,l1:"0",l2:"5",filled:true},
    {type:"seg",a:0,b:5,l1:"0",l2:"5",filled:false},
    {type:"rayR",a:5,l1:"5",filled:true},
    {type:"rayL",a:5,l1:"5",filled:true}
  ],ans:'1'});
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">6x − x² &gt; 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:0,b:6,l1:"0",l2:"6",filled:true},
    {type:"seg",a:0,b:6,l1:"0",l2:"6",filled:false},
    {type:"seg",a:-6,b:0,l1:"−6",l2:"0",filled:false},
    {type:"seg",a:-6,b:0,l1:"−6",l2:"0",filled:true}
  ],ans:'2'});
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">x² − 64 ≤ 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-8,b:8,l1:"−8",l2:"8",filled:true},
    {type:"seg",a:-8,b:8,l1:"−8",l2:"8",filled:false},
    {type:"rayR",a:8,l1:"8",filled:true},
    {type:"rayL",a:-8,l1:"−8",filled:true}
  ],ans:'1'});
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">25x² ≥ 4</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-0.4,b:0.4,l1:"−0,4",l2:"0,4",filled:true},
    {type:"seg",a:-0.4,b:0.4,l1:"−0,4",l2:"0,4",filled:false},
    {type:"raysIn",a:-0.4,b:0.4,l1:"−0,4",l2:"0,4",filled:false},
    {type:"raysOut",a:-0.4,b:0.4,l1:"−0,4",l2:"0,4",filled:true}
  ],ans:'4'});
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">x² − 100 &lt; 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-10,b:10,l1:"−10",l2:"10",filled:false},
    {type:"seg",a:-10,b:10,l1:"−10",l2:"10",filled:true},
    {type:"raysOut",a:-10,b:10,l1:"−10",l2:"10",filled:false},
    {type:"raysIn",a:-10,b:10,l1:"−10",l2:"10",filled:true}
  ],ans:'1'});
T.push({type:"Квадратное неравенство",text:'Укажите решение неравенства <span class="math">9x² − 1 ≤ 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-0.33,b:0.33,l1:"−1/3",l2:"1/3",filled:true},
    {type:"seg",a:-0.33,b:0.33,l1:"−1/3",l2:"1/3",filled:false},
    {type:"raysOut",a:-0.33,b:0.33,l1:"−1/3",l2:"1/3",filled:false},
    {type:"raysIn",a:-0.33,b:0.33,l1:"−1/3",l2:"1/3",filled:true}
  ],ans:'1'});

/* --- 19–21: Метод интервалов (скобки) --- */
T.push({type:"Метод интервалов",text:'Укажите решение неравенства <span class="math">(x + 2)(x − 4) ≤ 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-2,b:4,l1:"−2",l2:"4",filled:true},
    {type:"seg",a:-2,b:4,l1:"−2",l2:"4",filled:false},
    {type:"raysIn",a:-2,b:4,l1:"−2",l2:"4",filled:false},
    {type:"raysOut",a:-2,b:4,l1:"−2",l2:"4",filled:true}
  ],ans:'1'});
T.push({type:"Метод интервалов",text:'Укажите решение неравенства <span class="math">(x + 2)(x − 7) &gt; 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-2,b:7,l1:"−2",l2:"7",filled:true},
    {type:"seg",a:-2,b:7,l1:"−2",l2:"7",filled:false},
    {type:"raysOut",a:-2,b:7,l1:"−2",l2:"7",filled:false},
    {type:"raysIn",a:-2,b:7,l1:"−2",l2:"7",filled:true}
  ],ans:'3'});
T.push({type:"Метод интервалов",text:'Укажите решение неравенства <span class="math">(x − 1)(x + 5) ≥ 0</span>',
  graph:true,
  graphs:[
    {type:"seg",a:-5,b:1,l1:"−5",l2:"1",filled:false},
    {type:"seg",a:-5,b:1,l1:"−5",l2:"1",filled:true},
    {type:"raysOut",a:-5,b:1,l1:"−5",l2:"1",filled:true},
    {type:"raysIn",a:-5,b:1,l1:"−5",l2:"1",filled:false}
  ],ans:'3'});

/* --- 22–25: Обратная задача (по графику найти неравенство) --- */
T.push({type:"Анализ графика",text:'Укажите неравенство, решение которого изображено на рисунке.',
  customImage:{a:-7,b:7,filled:true},
  opts:['x² − 49 ≤ 0','x² + 49 ≤ 0','x² − 49 ≥ 0','x² + 49 ≥ 0'],ans:'1'});
T.push({type:"Анализ графика",text:'Укажите неравенство, решение которого изображено на рисунке.',
  customImage:{a:0,b:6,filled:false,out:true},
  opts:['x² − 6x &lt; 0','x² − 6x &gt; 0','x² − 36 &lt; 0','x² − 36 &gt; 0'],ans:'2'});
T.push({type:"Анализ графика",text:'Укажите неравенство, решение которого изображено на рисунке.',
  customImage:{a:-3,b:3,filled:false},
  opts:['x² − 9 ≤ 0','x² − 9 ≥ 0','x² − 9 &lt; 0','x² − 9 &gt; 0'],ans:'3'});
T.push({type:"Анализ графика",text:'Укажите неравенство, решение которого изображено на рисунке.',
  customImage:{a:-4,b:4,filled:true},
  opts:['x² − 16 ≤ 0','x² − 16 ≥ 0','x² − 16 &lt; 0','x² − 16 &gt; 0'],ans:'1'});

/* ===== Рендер ===== */
const root = document.getElementById('tasks');

function customImageSVG(cfg){
  const W=280,H=48,y=H/2;
  const scale = v => 26 + ((v+10)/20)*(W-2*26);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<line x1="14" y1="${y}" x2="${W-10}" y2="${y}" stroke="#334155" stroke-width="1.8"/>`;
  s+=arrowRight(W,y);
  if(cfg.out){
    const x1=scale(cfg.a), x2=scale(cfg.b);
    s+=shade(14,x1,y); s+=shade(x2,W-14,y);
    s+=pt(x1,y,cfg.filled); s+=pt(x2,y,cfg.filled);
    s+=label(x1,y,cfg.a); s+=label(x2,y,cfg.b);
  } else {
    const x1=scale(cfg.a), x2=scale(cfg.b);
    s+=shade(x1,x2,y);
    s+=pt(x1,y,cfg.filled); s+=pt(x2,y,cfg.filled);
    s+=label(x1,y,cfg.a); s+=label(x2,y,cfg.b);
  }
  s+=`</svg>`;
  return s;
}

T.forEach((t,i)=>{
  const card=document.createElement('div');
  card.className='task-card';

  let head=`<div class="task-header">
      <span class="task-number">Задание ${i+1}</span>
      <span class="task-type">${t.type}</span>
    </div>`;

  let body=`<div class="task-content">`;
  if(t.system){
    body+=`Укажите решение системы неравенств
      <div class="system-container">
        <div class="system-bracket">{</div>
        <div class="system-equations">
          ${t.system.map(e=>`<div class="math">${e}</div>`).join('')}
        </div>
      </div>`;
  } else if(t.customImage){
    body+=t.text;
    body+=`<div style="text-align:center;margin:16px 0">${customImageSVG(t.customImage)}</div>`;
  } else {
    body+=t.text;
  }
  body+=`</div>`;

  let opts=`<div class="options-grid">`;
  if(t.graph){
    t.graphs.forEach((g,idx)=>{
      opts+=`<label class="option option-graph">
        <div class="opt-line"><input type="radio" name="q${i}" value="${idx+1}"><span>${idx+1})</span></div>
        ${drawGraph(g)}
      </label>`;
    });
  } else {
    t.opts.forEach((o,idx)=>{
      opts+=`<label class="option">
        <input type="radio" name="q${i}" value="${idx+1}">
        <span>${idx+1}) <span class="math">${o}</span></span>
      </label>`;
    });
  }
  opts+=`</div>`;

  const foot=`<div class="answer-section">
      <span class="answer-label">Ответ:</span>
      <input type="text" class="answer-input" id="ans${i}" maxlength="1" placeholder="№">
      <button class="check-btn" onclick="check(${i},'${t.ans}')">Проверить</button>
      <span class="result" id="res${i}"></span>
    </div>`;

  card.innerHTML=head+body+opts+foot;
  root.appendChild(card);
});

function check(i,correct){
  const inp=document.getElementById('ans'+i);
  const res=document.getElementById('res'+i);
  const v=inp.value.trim();
  if(!v){res.className='result incorrect';res.textContent='Введите ответ!';return;}
  if(v===correct){res.className='result correct';res.textContent='✓ Верно!';}
  else{res.className='result incorrect';res.textContent='✗ Неверно, попробуйте ещё раз.';}
}
</script>
</body>
</html>
